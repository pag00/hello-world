# Local / single-host deployment: Postgres, MinIO (S3), sync server, web app.
# Copy .env.example to .env and adjust. `docker compose up --build`, then open http://localhost:8080
name: steptrack

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steptrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steptrack}
      POSTGRES_DB: ${POSTGRES_DB:-steptrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steptrack} -d ${POSTGRES_DB:-steptrack}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-steptrack}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-steptrack-secret}
    volumes:
      - miniodata:/data
    ports:
      - "9001:9001" # console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: ./server
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-steptrack}:${POSTGRES_PASSWORD:-steptrack}@postgres:5432/${POSTGRES_DB:-steptrack}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-steptrack}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-steptrack}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-steptrack-secret}
      S3_CREATE_BUCKET: "true"
      AUTH_MODE: ${AUTH_MODE:-dev}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      BLOB_MAX_BYTES: ${BLOB_MAX_BYTES:-26214400}
      ROOT_PATH: /api
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  web:
    # nginx serving the built PWA on :8080 and proxying /api/ -> http://server:8000/ (prefix stripped)
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
